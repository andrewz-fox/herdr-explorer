[project]
name = "herdr-explorer"
version = "0.1.0"
description = "Read-only Herdr project browser and Git review companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual[syntax]>=6",
  "watchdog>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["herdr_explorer*"]

[tool.setuptools.package-data]
herdr_explorer = ["styles/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
pythonpath = ["dev"]
